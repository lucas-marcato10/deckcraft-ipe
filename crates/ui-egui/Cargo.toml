[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
craft-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# Frame and texture instrumentation: instrument handles come from `deckcraft-telemetry` (L0), the
# `KeyValue` attributes from the OTel API. No SDK here — the app installs it at its boundary.
deckcraft-telemetry = { workspace = true }
opentelemetry = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# `testing` adds `InMemoryMetricExporter`: the only way to read back what the meter provider
# actually recorded. A dev-dependency, so the shipped binary never links the SDK test helpers.
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
# The A/B harness serialises the in-memory batches as official OTLP JSON Lines, using the same
# proto transforms the app's file exporters use. Test-only: the app owns the production exporter.
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
