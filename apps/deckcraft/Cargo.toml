[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft desktop app"
publish = false
default-run = "deckcraft"

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-media = { workspace = true }
# Telemetry is wired **only** at this boundary: L0 (`crates/telemetry`) carries the OTel API
# alone, the SDK and the exporters live here. `opentelemetry-otlp`'s default features include
# `reqwest-blocking-client`, which is what lets `PeriodicReader`/`BatchSpanProcessor` export from
# their own threads with **no Tokio runtime**; the async clients are the optional ones.
deckcraft-telemetry = { workspace = true }
opentelemetry = { version = "=0.33.1", features = ["metrics", "trace", "logs"] }
# No `testing` here: `InMemoryMetricExporter` is a dev-dependency feature (see the bottom of this
# file), so the shipped binary does not pull `tokio/sync` in through the SDK's test helpers.
opentelemetry_sdk = { version = "=0.33.1", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = true, features = ["metrics", "trace", "logs"] }
opentelemetry-appender-log = "=0.33.1"
# OTLP message types plus the SDK→proto transforms the file exporter serialises. No `gen-tonic`
# (that is what drags in tonic); `with-serde` produces the OTLP/JSON encoding of the spec.
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics", "logs"] }
# `clipboard` is the OS clipboard (Ctrl+C/X/V with other apps). Without it egui simulates one inside
# the app; the egui 0.37 migration (#1350) dropped it from this list.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }
cpal = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a DeckCraft deck.pptx` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# GridCraft, PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe, which
# our workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
# `testing` adds `InMemoryMetricExporter`, the only way to read back what the meter provider
# actually recorded. Kept out of `[dependencies]` so `tokio/sync` (which the feature enables
# inside the SDK) never reaches the shipped binary.
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
